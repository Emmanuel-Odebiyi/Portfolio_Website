<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Identity Confirmation</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <h1 style="font-family: sans-serif; text-align: center; margin-top: 100px;">
    Confirming your account...
  </h1>
  <script>
    // If we arrive here with a confirmation or invite token, the widget handles it
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function(user) {
        if (user) {
          // Already confirmed, redirect to main site admin
          window.location.href = "https://emmanuelodebiyi.name.ng/admin/";
        }
      });
    }
  </script>
</body>
</html>
