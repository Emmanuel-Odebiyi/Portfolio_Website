# =========================================================================
# Nginx Configuration Block for WordPress Permalinks and Dashboard 404 Fixes
# =========================================================================
# Add or replace the location blocks inside your domain's active server block
# usually located in: /etc/nginx/sites-available/your-domain.conf

# 1. Standard WordPress Permalinks support
location / {
    # If the requested URI doesn't exist as a physical file or directory,
    # pass it to index.php with the original query parameters.
    try_files $uri $uri/ /index.php?$args;
}

# 2. Redirect wp-admin requests without a trailing slash to prevent redirection loops
rewrite ^/wp-admin$ $scheme://$host$uri/ permanent;

# 3. Ensure PHP files are executed securely and properly
location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    
    # Update this path to match your PHP-FPM socket handler:
    # Common examples: 
    # - unix:/var/run/php/php8.2-fpm.sock
    # - unix:/run/php/php8.0-fpm.sock
    # - 127.0.0.1:9000
    fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
}

# 4. Block access to hidden configuration files and sensitive directories
location ~* litespeed|/\.(htaccess|git|wp-config\.php|readme\.html|license\.txt) {
    deny all;
}
