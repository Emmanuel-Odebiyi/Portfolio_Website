<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager | Emmanuel Odebiyi</title>
</head>
<body>
  <!-- Load Identity widget first -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Initialize Identity widget AFTER it has loaded -->
  <script>
    window.addEventListener("load", function() {
      if (window.netlifyIdentity) {
        window.netlifyIdentity.init({
          APIUrl: "https://guileless-malasada-3d31ba.netlify.app/.netlify/identity"
        });
        window.netlifyIdentity.on("login", function() {
          document.location.href = "/admin/";
        });
      }
    });
  </script>

  <!-- Load Decap CMS after Identity widget is set up -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
