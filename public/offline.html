<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline — Emmanuel Odebiyi</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0a0a0a;
      color: #f8f8f6;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      padding: 2rem;
      text-align: center;
    }

    .container {
      max-width: 480px;
    }

    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 2rem;
      opacity: 0.8;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      display: block;
      animation: pulse 2s ease-in-out infinite;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 1rem;
      line-height: 1.7;
      color: #a1a1aa;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #f8f8f6;
      color: #0a0a0a;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s ease;
    }

    .btn:hover { opacity: 0.85; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @media (prefers-color-scheme: light) {
      body { background-color: #f8f8f6; color: #0a0a0a; }
      p { color: #52525b; }
      .btn { background: #0a0a0a; color: #f8f8f6; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.svg" alt="Emmanuel Odebiyi Logo" class="logo" />
    <span class="icon">📡</span>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. 
      Check your connection and try again — the page will reload automatically once you're back online.
    </p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
  </div>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
